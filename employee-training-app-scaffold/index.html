<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02070d">
  <meta name="description" content="Playbook employee product training app.">
  <title>Playbook</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/branding/playbook-mark.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/home-showcase.css">
  <link rel="stylesheet" href="css/workflow-polish.css">
  <link rel="stylesheet" href="css/compare.css">
  <link rel="stylesheet" href="css/category-choice.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/visual-consistency.css">
  <link rel="stylesheet" href="css/product-card-sizing.css">
  <link rel="stylesheet" href="css/favorites.css">
  <link rel="stylesheet" href="css/cms-integration.css">
  <link rel="stylesheet" href="css/product-detail-2.css">
  <link rel="stylesheet" href="css/product-performance.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <a class="brand" href="#/" aria-label="Playbook home">
        <img class="brand__mark" src="assets/branding/playbook-mark.svg" alt="" width="42" height="42">
        <span class="brand__text">
          <strong>PLAYBOOK</strong>
          <small>Employee Training</small>
        </span>
      </a>
    </header>

    <main id="main-content" class="page" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <a class="bottom-nav__item bottom-nav__item--active" href="#/" data-nav="home" aria-current="page">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5v9A1.5 1.5 0 0 1 19.5 21H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/>
        </svg>
        <span>Home</span>
      </a>

      <a class="bottom-nav__item" href="#/search" data-nav="search">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m16.5 16.5 4 4"></path>
        </svg>
        <span>Search</span>
      </a>

      <a
        class="bottom-nav__item"
        href="#/favorites"
        data-nav="favorites"
      >
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20.5 4.8 13.8A5.2 5.2 0 0 1 12 6.4a5.2 5.2 0 0 1 7.2 7.4z"></path>
        </svg>
        <span>Favorites</span>
      </a>

      <button class="bottom-nav__item" type="button" data-coming-soon="More">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="1.5"></circle>
          <circle cx="12" cy="12" r="1.5"></circle>
          <circle cx="19" cy="12" r="1.5"></circle>
        </svg>
        <span>More</span>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
