<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 600" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#88b4d8"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="600" fill="#0b111a"/>

  <!-- Snowboard Body -->
  <path d="M 125,32 
           C 165,32 175,70 162,180 
           C 152,260 152,340 165,420 
           C 175,530 160,568 115,568 
           C 70,568 35,530 38,420 
           C 42,340 42,260 35,180 
           C 25,70 70,32 125,32 Z" 
        fill="#121a24" stroke="#88b4d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Binding Inserts (5x2) -->
  <g fill="none" stroke="#88b4d8" stroke-width="1.5">
    <!-- Left Column -->
    <circle cx="85" cy="195" r="3"/><circle cx="85" cy="210" r="3"/><circle cx="85" cy="225" r="3"/><circle cx="85" cy="240" r="3"/><circle cx="85" cy="255" r="3"/>
    <!-- Right Column -->
    <circle cx="105" cy="195" r="3"/><circle cx="105" cy="210" r="3"/><circle cx="105" cy="225" r="3"/><circle cx="105" cy="240" r="3"/><circle cx="105" cy="255" r="3"/>
  </g>

  <!-- Bottom Binding Inserts (5x2) -->
  <g fill="none" stroke="#88b4d8" stroke-width="1.5">
    <!-- Left Column -->
    <circle cx="85" cy="355" r="3"/><circle cx="85" cy="370" r="3"/><circle cx="85" cy="385" r="3"/><circle cx="85" cy="400" r="3"/><circle cx="85" cy="415" r="3"/>
    <!-- Right Column -->
    <circle cx="105" cy="355" r="3"/><circle cx="105" cy="370" r="3"/><circle cx="105" cy="385" r="3"/><circle cx="105" cy="400" r="3"/><circle cx="105" cy="415" r="3"/>
  </g>

  <!-- Side Curved Arrow (Left) -->
  <path d="M 24,320 C 20,300 24,280 24,280" fill="none" stroke="#88b4d8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Side Curved Arrow (Right) -->
  <path d="M 176,280 C 180,300 176,320 176,320" fill="none" stroke="#88b4d8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom Curved Arrow -->
  <path d="M 120,578 C 100,582 70,575 70,575" fill="none" stroke="#88b4d8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
