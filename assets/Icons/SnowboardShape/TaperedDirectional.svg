    <circle cx="86" cy="370" r="3"/><circle cx="86" cy="385" r="3"/><circle cx="86" cy="400" r="3"/><circle cx="86" cy="415" r="3"/><circle cx="86" cy="430" r="3"/>
    <circle cx="106" cy="370" r="3"/><circle cx="106" cy="385" r="3"/><circle cx="106" cy="400" r="3"/><circle cx="106" cy="415" r="3"/><circle cx="106" cy="430" r="3"/>
