<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="blueArrowGrad2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="600" fill="#0b111a"/>

  <!-- Pink Reference Lines & Geometry Box -->
  <g stroke="#a855f7" stroke-width="0.8" opacity="0.6" fill="none">
    <!-- Center Line -->
    <line x1="100" y1="10" x2="100" y2="590"/>
    <!-- Top & Bottom Points -->
    <circle cx="100" cy="18" r="3" stroke-width="1.2"/>
    <circle cx="100" cy="582" r="3" stroke-width="1.2"/>
    <!-- Upper Box -->
    <path d="M 18,18 L 182,18 L 166,200 L 34,200 Z"/>
    <circle cx="18" cy="18" r="3" stroke-width="1.2"/>
    <circle cx="182" cy="18" r="3" stroke-width="1.2"/>
    <circle cx="34" cy="200" r="3" stroke-width="1.2"/>
    <circle cx="166" cy="200" r="3" stroke-width="1.2"/>
    <!-- Lower Box -->
    <path d="M 34,380 L 166,380 L 182,582 L 18,582 Z"/>
    <circle cx="34" cy="380" r="3" stroke-width="1.2"/>
    <circle cx="166" cy="380" r="3" stroke-width="1.2"/>
    <circle cx="18" cy="582" r="3" stroke-width="1.2"/>
    <circle cx="182" cy="582" r="3" stroke-width="1.2"/>
  </g>

  <!-- Snowboard Body -->
  <path d="M 100,18 
           C 150,18 165,45 162,110 
           C 158,200 156,290 158,380 
           C 162,470 150,582 100,582 
           C 50,582 38,470 42,380 
           C 44,290 42,200 38,110 
           C 35,45 50,18 100,18 Z" 
        fill="#121a24" stroke="#88b4d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Directional Blue Arrow at Top -->
  <path d="M 100,60 L 100,100 M 100,60 L 88,80 M 100,60 L 112,80" fill="none" stroke="url(#blueArrowGrad2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Binding Inserts (5x2) -->
  <g fill="none" stroke="#88b4d8" stroke-width="1.5">
    <circle cx="86" cy="185" r="3"/><circle cx="86" cy="200" r="3"/><circle cx="86" cy="215" r="3"/><circle cx="86" cy="230" r="3"/><circle cx="86" cy="245" r="3"/>
    <circle cx="106" cy="185" r="3"/><circle cx="106" cy="200" r="3"/><circle cx="106" cy="215" r="3"/><circle cx="106" cy="230" r="3"/><circle cx="106" cy="245" r="3"/>
  </g>

  <!-- Bottom Binding Inserts (5x2) -->
  <g fill="none" stroke="#88b4d8" stroke-width="1.5">
    <circle cx="86" cy="365" r="3"/><circle cx="86" cy="380" r="3"/><circle cx="86" cy="395" r="3"/><circle cx="86" cy="410" r="3"/><circle cx="86" cy="425" r="3"/>
    <circle cx="106" cy="365" r="3"/><circle cx="106" cy="380" r="3"/><circle cx="106" cy="395" r="3"/><circle cx="106" cy="410" r="3"/><circle cx="106" cy="425" r="3"/>
  </g>

  <!-- Stance Reference Bracket Right -->
  <path d="M 120,368 L 160,368 L 160,388 L 120,388" fill="none" stroke="#88b4d8" stroke-width="1.2"/>
</svg>
