        fill="#121a24" stroke="#88b4d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Directional Blue Arrow at Top -->
  <path d="M 100,70 L 100,115 M 100,70 L 85,95 M 100,70 L 115,95" fill="none" stroke="url(#blueArrowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Binding Inserts (5x2) -->
  <g fill="none" stroke="#88b4d8" stroke-width="1.5">
    <circle cx="86" cy="185" r="3"/><circle cx="86" cy="200" r="3"/><circle cx="86" cy="215" r="3"/><circle cx="86" cy="230" r="3"/><circle cx="86" cy="245" r="3"/>
    <circle cx="106" cy="185" r="3"/><circle cx="106" cy="200" r="3"/><circle cx="106" cy="215" r="3"/><circle cx="106" cy="230" r="3"/><circle cx="106" cy="245" r="3"/>
  </g>

  <!-- Bottom Binding Inserts (5x2) -->
  <g fill="none" stroke="#88b4d8" stroke-width="1.5">
    <circle cx="86" cy="365" r="3"/><circle cx="86" cy="380" r="3"/><circle cx="86" cy="395" r="3"/><circle cx="86" cy="410" r="3"/><circle cx="86" cy="425" r="3"/>
    <circle cx="106" cy="365" r="3"/><circle cx="106" cy="380" r="3"/><circle cx="106" cy="395" r="3"/><circle cx="106" cy="410" r="3"/><circle cx="106" cy="425" r="3"/>
  </g>

  <!-- Offset Indicator Bracket on Right -->
  <path d="M 125,355 L 163,355 L 163,420 L 125,420" fill="none" stroke="#88b4d8" stroke-width="1.2"/>
