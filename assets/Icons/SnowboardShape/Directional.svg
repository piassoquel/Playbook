<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="blueArrowGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Nose Reference Box Lines -->
  <path d="M 16,20 L 184,20 L 165,110 M 16,20 L 35,110" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>
  <circle cx="16" cy="20" r="3" fill="none" stroke="#a855f7" stroke-width="1.2"/>
  <circle cx="184" cy="20" r="3" fill="none" stroke="#a855f7" stroke-width="1.2"/>

  <!-- Snowboard Body -->
  <path d="M 100,20 
